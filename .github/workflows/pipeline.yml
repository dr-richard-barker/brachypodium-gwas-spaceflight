name: AstroGrass Pipeline & GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy scipy matplotlib python-docx fpdf2

      - name: Execute AstroGrass Automated Pipeline
        run: |
          python code/run_pipeline.py --skip-download

      - name: Verify Build Artifacts
        run: |
          test -f tables/astrograss_master_table.csv
          test -f tables/video_catalog.csv
          test -f data/genotypes/gravitropism_candidate_genes.csv
          test -f docs/js/astrograss_database.json
          test -f figures/fig1_osd375_sample_design.png
          test -f figures/fig2_astrograss_architecture.png
          test -f figures/figS1_mission_experimental_design.png
          test -f manuscript/manuscript.pdf
          test -f manuscript/manuscript.docx
          echo "✓ All core database, figure, and manuscript deliverables verified."
          # Rebuilt outputs must match what is committed; a difference means a build product is stale.
          git status --porcelain -- tables data docs/js docs/tables
          test -z "$(git status --porcelain -- tables data docs/js docs/tables)"

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
