[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brachypodium-gwas-spaceflight"
version = "0.1.0"
description = "AstroGrass: a curated resource for the Brachypodium distachyon ISS transcriptome study OSD-375 (APEX-06) and gravitropism candidate genes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Richard Barker", email = "dr.richard.barker@gmail.com" }
]
keywords = [
    "Brachypodium distachyon",
    "gravitropism",
    "spaceflight",
    "transcriptomics",
    "NASA OSDR",
    "OSD-375",
    "APEX-06",
    "monocot",
    "microgravity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: R"
]
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "python-docx>=1.0.0",
    "fpdf2>=2.7.0"
]

[tool.setuptools]
# Scripts live in code/ and are run directly; there is no importable package.
packages = []

[project.urls]
Homepage = "https://github.com/dr-richard-barker/brachypodium-gwas-spaceflight"
Repository = "https://github.com/dr-richard-barker/brachypodium-gwas-spaceflight"
Documentation = "https://dr-richard-barker.github.io/brachypodium-gwas-spaceflight"
