[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brachypodium-gwas-spaceflight"
version = "0.1.0"
description = "Brachypodium GWAS-Spaceflight Integration: Connecting Gravitropic Reorientation Natural Variation with ISS Microgravity Transcriptomics (OSD-375)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Richard Barker", email = "richard.barker@phylo.com" }
]
keywords = [
    "Brachypodium distachyon",
    "GWAS",
    "gravitropism",
    "spaceflight",
    "transcriptomics",
    "NASA OSDR",
    "OSD-375",
    "APEX-06",
    "monocot",
    "cereal crops",
    "microgravity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: R"
]
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "biopython>=1.81",
    "pydeseq2>=0.4.0",
    "statsmodels>=0.14.0",
    "networkx>=3.1",
    "genelab-utils>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/dr-richard-barker/brachypodium-gwas-spaceflight"
Repository = "https://github.com/dr-richard-barker/brachypodium-gwas-spaceflight"
Documentation = "https://dr-richard-barker.github.io/brachypodium-gwas-spaceflight"
